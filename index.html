<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>খতিয়ান অংশ ক্যালকুলেটর</title>

<style>
body {
  font-family: "Noto Sans Bengali", sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin: 0;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  text-align: center;
}

.note {
  text-align: center;
  font-size: 13px;
  color: gray;
  margin-bottom: 15px;
}

label {
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.calc-btn {
  background: #007bff;
  color: white;
}

.reset-btn {
  background: #6c757d;
  color: white;
}

.result {
  margin-top: 15px;
  padding: 10px;
  background: #f8f9fa;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>📊 খতিয়ান অংশ ক্যালকুলেটর</h2>
<p class="note">👉 প্রথমে মিউটেশন, তারপর আগত খতিয়ান দিন</p>

<label>মিউটেশন খতিয়ানের মোট জমি</label>
<input type="text" id="mutation" placeholder="যেমন: 0.053625">

<select id="u1">
<option value="acre">একর</option>
<option value="shotok">শতক</option>
</select>

<label>আগত খতিয়ানের মোট জমি</label>
<input type="text" id="incoming" placeholder="যেমন: 0.3200">

<select id="u2">
<option value="acre">একর</option>
<option value="shotok">শতক</option>
</select>

<button class="calc-btn" onclick="calc()">হিসাব করুন</button>
<button class="reset-btn" onclick="resetAll()">রিসেট</button>

<div class="result" id="out"></div>

</div>
</div>

<script>
function toAcre(v,u){
  return u==="shotok"?v/100:v;
}

// বাংলা সংখ্যা → ইংরেজি
function parseBN(str){
  const bn="০১২৩৪৫৬৭৮৯";
  const en="0123456789";
  return str.replace(/[০-৯]/g,d=>en[bn.indexOf(d)]);
}

function calc(){
  let m=parseFloat(parseBN(mutation.value));
  let i=parseFloat(parseBN(incoming.value));

  if(!m || !i){
    out.innerHTML="⚠️ সঠিক সংখ্যা দিন";
    return;
  }

  let mA=toAcre(m,u1.value);
  let iA=toAcre(i,u2.value);

  // swap logic (উল্টা দিলে ঠিক করবে)
  if(mA > iA){
    let temp = mA;
    mA = iA;
    iA = temp;
  }

  let share = mA / iA;
  let percent = share * 100;
  let remain = iA - mA;

  out.innerHTML =
  "অংশ: " + share.toFixed(5) +
  "<br>শতাংশ: " + percent.toFixed(5) + "%" +
  "<br>বাকি জমি: " + remain.toFixed(5) + " একর";
}

function resetAll(){
  mutation.value="";
  incoming.value="";
  out.innerHTML="";
}
</script>

</body>
</html>
