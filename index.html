<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>খতিয়ান অংশ ক্যালকুলেটর</title>

<style>
body {
  font-family: "Noto Sans Bengali", sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 420px;
  margin: auto;
}

h2 {
  text-align: center;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  font-size: 16px;
}

button {
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 10px;
  font-weight: bold;
}

.note {
  font-size: 13px;
  color: gray;
}
</style>

</head>

<body>

<div class="card">
<h2>📊 খতিয়ান অংশ ক্যালকুলেটর</h2>

<p class="note">👉 যেকোনো ক্রমে সংখ্যা দিলেও সিস্টেম নিজে ঠিক করে নিবে</p>

<label>আগত খতিয়ানের মোট জমি</label>
<input type="text" id="total" placeholder="যেমন: 0.3200">

<select id="u1">
<option value="acre">একর</option>
<option value="shotok">শতক</option>
</select>

<label>মিউটেশন খতিয়ানের মোট জমি</label>
<input type="text" id="own" placeholder="যেমন: 0.053625">

<select id="u2">
<option value="acre">একর</option>
<option value="shotok">শতক</option>
</select>

<button onclick="calc()">হিসাব করুন</button>
<button onclick="resetAll()">রিসেট</button>

<div class="result" id="out"></div>

</div>

<script>
function toAcre(value, unit) {
  return unit === "shotok" ? value / 100 : value;
}

function parseBanglaNumber(str) {
  const bn = "০১২৩৪৫৬৭৮৯";
  const en = "0123456789";
  return str.replace(/[০-৯]/g, d => en[bn.indexOf(d)]);
}

function calc() {
  let total = parseBanglaNumber(document.getElementById("total").value);
  let own = parseBanglaNumber(document.getElementById("own").value);

  let t = toAcre(parseFloat(total), u1.value);
  let o = toAcre(parseFloat(own), u2.value);

  if (!t || !o) {
    out.innerHTML = "⚠️ সঠিক সংখ্যা দিন";
    return;
  }

  // auto swap
  if (o > t) {
    let temp = t;
    t = o;
    o = temp;
  }

  let share = o / t;
  let percent = share * 100;

  out.innerHTML =
    "অংশ: " + share.toFixed(3) +
    "<br>শতাংশ: " + percent.toFixed(2) + "%";
}

function resetAll() {
  total.value = "";
  own.value = "";
  out.innerHTML = "";
}
</script>

</body>
</html>
